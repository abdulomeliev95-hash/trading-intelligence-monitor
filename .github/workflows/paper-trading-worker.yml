name: Paper trading worker

on:
  schedule:
    # Keep the worker alive in bounded sessions while avoiding the top of the hour.
    - cron: "7 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Worker duration for a manual run (scheduled runs use 20,700 seconds)"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: paper-trading-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WORKER_DURATION_SECONDS: ${{ inputs.duration_seconds || 20700 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run worker for the configured duration
        run: python worker.py --duration-seconds "$WORKER_DURATION_SECONDS"
